<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account | ATONEMENT.</title><script src="../api-config.js"></script><script src="../storefront-api.js"></script><style>body{margin:0;background:#f6f5ec;color:#1a1812;font:16px/1.5 system-ui}main{max-width:850px;margin:48px auto;padding:24px}section{background:#fffdf7;border:1px solid #ddd8c6;padding:24px;margin:18px 0}input,button{font:inherit;padding:10px;margin:4px;border:1px solid #aaa}button{background:#1a1812;color:white;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:8px}.message{min-height:1.5em}</style></head><body><main><a href="clothe-home.html">ATONEMENT.</a><h1>My account</h1><section><h2>Profile</h2><p id="profile">Loading account…</p><a href="orders.html">View my orders</a> <button id="logout" type="button">Sign out</button></section><section><h2>Delivery addresses</h2><form id="address-form"><div class="row"><input name="label" placeholder="Label (optional)"><input name="line1" placeholder="Street address" required><input name="line2" placeholder="Apartment (optional)"><input name="city" placeholder="City" required><input name="state" placeholder="State"><input name="country" placeholder="Country" required><label><input type="checkbox" name="isDefault">Default address</label><button>Add address</button></div></form><p id="address-message" class="message" role="status"></p><ul id="addresses"></ul></section><section><h2>Change password</h2><form id="password-form"><input name="currentPassword" type="password" placeholder="Current password" required><input name="newPassword" type="password" minlength="8" placeholder="New password (8+ characters)" required><button>Change password</button></form><p id="password-message" class="message" role="status"></p></section></main><script>
const api=window.StorefrontAPI, esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{if(!api.isSignedIn()){location.href='login.html?returnTo=account.html';return}try{const p=await api.request('/users/me');document.getElementById('profile').textContent=`${p.username||p.name||''} · ${p.email||''} · ${p.phone||''}`;document.getElementById('addresses').innerHTML=(p.addresses||[]).map(a=>`<li>${esc([a.label,a.line1,a.line2,a.city,a.state,a.country].filter(Boolean).join(', '))}${a.isDefault?' (default)':''}</li>`).join('')||'<li>No saved addresses yet.</li>'}catch(e){document.getElementById('profile').textContent=e.message}})();
document.getElementById('address-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const body=Object.fromEntries(f);body.isDefault=f.has('isDefault');try{await api.request('/users/customer/me/addresses',{method:'POST',body:JSON.stringify(body)});location.reload()}catch(err){document.getElementById('address-message').textContent=err.message}});
document.getElementById('password-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api.request('/users/customer/me/password',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.currentTarget.reset();document.getElementById('password-message').textContent='Password updated.'}catch(err){document.getElementById('password-message').textContent=err.message}});
document.getElementById('logout').addEventListener('click',async()=>{await api.logout();location.href='clothe-home.html'});
</script></body></html>

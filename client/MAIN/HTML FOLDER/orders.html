<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My orders | ATONEMENT.</title><script src="../api-config.js"></script><script src="../storefront-api.js"></script><style>body{margin:0;background:#f6f5ec;color:#1a1812;font:16px/1.5 system-ui}main{max-width:960px;margin:48px auto;padding:24px}article{background:#fffdf7;border:1px solid #ddd8c6;padding:20px;margin:16px 0}li{margin:5px 0}</style></head><body><main><a href="clothe-home.html">ATONEMENT.</a> · <a href="account.html">My account</a><h1>My orders</h1><p id="message">Loading orders…</p><div id="orders"></div></main><script>
const api=window.StorefrontAPI, esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0));
(async()=>{if(!api.isSignedIn()){location.href='login.html?returnTo=orders.html';return}try{const data=await api.request('/orders/mine?page=1&pageSize=100');const orders=data.items||[];document.getElementById('message').textContent=orders.length?`${data.total||orders.length} order(s)`: 'You have no orders yet.';document.getElementById('orders').innerHTML=orders.map(o=>`<article><h2>${esc(o.orderNumber)} · ${esc(o.status)}</h2><p>${new Date(o.createdAt).toLocaleString()} · Total ${money(o.total)}</p><ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} ${esc([i.size,i.color].filter(Boolean).join(' / '))} × ${i.quantity} — ${money(i.unitPrice*i.quantity)}</li>`).join('')}</ul><p>Deliver to: ${esc([o.shippingAddress?.line1,o.shippingAddress?.city,o.shippingAddress?.country].filter(Boolean).join(', '))}</p></article>`).join('')}catch(e){document.getElementById('message').textContent=e.message}})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer messages | ATONEMENT.</title><script src="../api-config.js"></script><script src="../admin-api.js"></script><style>body{margin:0;background:#f6f3ed;color:#211d18;font:16px/1.5 system-ui}main{max-width:1100px;margin:36px auto;padding:20px}article{background:white;padding:18px;margin:14px 0;border-radius:8px}button{padding:8px 14px;margin:4px;cursor:pointer}</style></head><body><main><h1>Customer messages</h1><p id="message">Loading…</p><div id="messages"></div></main><script>
const api=window.AdminAPI,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=document.getElementById('messages'),notice=document.getElementById('message');
(async()=>{try{const result=await api.request('/contact?page=1&pageSize=100');notice.textContent=`${result.total||0} message(s)`;list.innerHTML=(result.items||[]).map(item=>`<article><h2>${esc(item.name)} · ${esc(item.status)}</h2><p><a href="tel:${esc(item.phone)}">${esc(item.phone)}</a> · ${new Date(item.createdAt).toLocaleString()}</p><p style="white-space:pre-wrap">${esc(item.message)}</p><label>Status <select data-status="${esc(item._id)}"><option ${item.status==='NEW'?'selected':''}>NEW</option><option ${item.status==='READ'?'selected':''}>READ</option><option ${item.status==='CLOSED'?'selected':''}>CLOSED</option></select></label></article>`).join('')||'<p>No messages received.</p>'}catch(e){notice.textContent=e.message}})();
list.addEventListener('change',async event=>{const select=event.target.closest('[data-status]');if(!select)return;try{await api.request(`/contact/${select.dataset.status}/status`,{method:'PATCH',body:JSON.stringify({status:select.value})});notice.textContent='Message status updated.'}catch(e){notice.textContent=e.message}});
</script><script src="../admin-nav.js"></script></body></html>

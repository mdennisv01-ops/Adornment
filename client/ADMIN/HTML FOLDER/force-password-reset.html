<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password | Adornment Admin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f2eb;color:#211d18;font:16px/1.5 Arial,sans-serif}.card{width:min(460px,100%);padding:32px;background:#fff;border-radius:16px;box-shadow:0 16px 40px #211d1814}h1{margin:0 0 8px}p{color:#5b554f}label{display:block;margin:18px 0 6px;font-weight:700}input{width:100%;padding:12px;border:1px solid #c9c3bb;border-radius:8px;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#211d18;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:24px;color:#a32c20}
  </style>
  <script src="../api-config.js"></script>
  <script src="../admin-api.js"></script>
</head>
<body>
  <main class="card">
    <h1>Choose a new password</h1>
    <p>This temporary admin password must be replaced before you can use the dashboard. Choose at least 12 characters.</p>
    <form id="reset-form">
      <label for="current-password">Temporary password</label>
      <input id="current-password" type="password" autocomplete="current-password" required>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required>
      <button type="submit">Save new password</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form=document.getElementById('reset-form');
    const message=document.getElementById('message');
    form.addEventListener('submit',async event=>{
      event.preventDefault();message.textContent='';
      const currentPassword=document.getElementById('current-password').value;
      const newPassword=document.getElementById('new-password').value;
      if(newPassword.length<12){message.textContent='Use at least 12 characters.';return}
      if(newPassword!==document.getElementById('confirm-password').value){message.textContent='The new passwords do not match.';return}
      const button=form.querySelector('button');button.disabled=true;button.textContent='Saving…';
      try{
        await window.AdminAPI.request('/users/staff/me/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword})});
        localStorage.removeItem('adornment_staff_access_token');localStorage.removeItem('adornment_staff_name');
        message.textContent='Password saved. Sign in with your new password.';
        setTimeout(()=>location.replace('login.html'),900);
      }catch(error){message.textContent=error.message||'Unable to update your password.'}
      finally{button.disabled=false;button.textContent='Save new password'}
    });
  </script>
</body>
</html>

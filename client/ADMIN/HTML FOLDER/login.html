<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f2eb;
      color: #1c1c1c;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .login-card {
      width: min(420px, 92vw);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 35px rgba(0,0,0,0.08);
      padding: 32px 28px;
    }
    h1 { margin: 0 0 12px; }
    p { margin: 0 0 20px; color: #4b4b4b; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d5d0c8;
      border-radius: 10px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #1f1a17;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: progress; }
    .error { min-height: 20px; color: #b3261e; margin-top: 8px; font-size: 0.9rem; }
  </style>
  <script src="../api-config.js"></script>
</head>
<body>
  <div class="login-card">
    <h1>Admin Login</h1>
    <p>Sign in with the owner account provisioned for this store.</p>
    <form id="admin-login-form">
      <div class="field">
        <label for="email">Username or email</label>
        <input id="email" name="identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
      <div class="error" id="form-error" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('admin-login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorBox = document.getElementById('form-error');
    const API_BASE_URL = window.API_BASE_URL || 'http://localhost:4000/api';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/staff/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            identifier: email.value.trim(),
            password: password.value,
          }),
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload?.message || 'Login failed.');
        }

        const accessToken = payload?.data?.accessToken;
        const staffName = payload?.data?.staff?.name || 'Seller';
        const mustChangePassword = Boolean(payload?.data?.staff?.mustChangePassword);
        if (accessToken) {
          localStorage.setItem('adornment_staff_access_token', accessToken);
          localStorage.setItem('adornment_staff_name', staffName);
        }

        window.location.href = mustChangePassword ? 'force-password-reset.html' : 'dashboard.html';
      } catch (error) {
        errorBox.textContent = error.message || 'Unable to sign in right now.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
